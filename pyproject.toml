[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-wiki-agenc"
version = "0.1.0"
description = "Minimal starter repo for the LLM Wiki pattern."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
wiki = "brainstew.cli:main"

[tool.setuptools]
packages = ["brainstew"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
