[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "brainstew"
version = "0.1.0"
description = "A markdown wiki starter built for AgenC (LLM Wiki pattern)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[project.scripts]
wiki = "brainstew.cli:main"

[tool.setuptools]
packages = ["brainstew"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
